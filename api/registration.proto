syntax = "proto3";
package registration.v1;
option go_package = "registration.local/backend/api;api";

service Registration {
  rpc Accept(Update) returns (Receipt);
  rpc Claim(ClaimRequest) returns (Delivery);
  rpc Complete(Completion) returns (Receipt);
  rpc Export(ExportRequest) returns (ExportResponse);
  rpc Members(MembersRequest) returns (MembersResponse);
  rpc SyncMember(SyncMemberRequest) returns (Receipt);
}
message Update {
  int64 id = 1;
  int64 actor = 2;
  int64 chat = 3;
  string chat_type = 4;
  string username = 5;
  string display_name = 6;
  string text = 7;
  string callback = 8;
  string phone = 9;
  int64 contact_owner = 10;
  int64 message_id = 11;
  string kind = 12;
  int64 member_id = 13;
  bool member_active = 14;
  string chat_title = 15;
}
message Receipt { bool duplicate = 1; }
message Field { string key = 1; string value = 2; }
message Button { string label_key = 1; string data = 2; }
message View {
  string kind = 1;
  string field = 2;
  repeated Field fields = 3;
  repeated Button buttons = 4;
  repeated int64 numbers = 5;
  string code = 6;
}
message ClaimRequest { int64 id = 1; string worker = 2; }
message Delivery {
  int64 id = 1;
  string lease = 2;
  int64 chat = 3;
  string kind = 4;
  View view = 5;
  int64 source_chat = 6;
  int64 source_message = 7;
  int64 actor = 8;
  string traceparent = 9;
  int64 not_before_unix_ms = 10;
  bool group = 11;
}
message Completion {
  int64 id = 1;
  string lease = 2;
  string outcome = 3;
  int64 telegram_message_id = 4;
  int64 retry_after_seconds = 5;
  string error_code = 6;
  int64 next_after = 7;
  int64 checked = 8;
  int64 failed_members = 9;
}
message ExportRequest { int64 actor = 1; }
message ExportResponse { bytes xlsx = 1; }
message MembersRequest { int64 actor = 1; string role = 2; int64 after = 3; }
message MembersResponse { int64 chat = 1; repeated int64 users = 2; }
message SyncMemberRequest { int64 actor = 1; int64 chat = 2; int64 user = 3; bool active = 4; }
