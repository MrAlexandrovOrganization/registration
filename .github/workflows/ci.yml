name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: versions
        run: make -s versions >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.versions.outputs.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: |
            .bin/buf
            .bin/protoc-gen-go
            .bin/protoc-gen-go-grpc
            .bin/goimports
          key: go-tools-v1-${{ runner.os }}-${{ runner.arch }}-go${{ steps.versions.outputs.GO_VERSION }}-${{ hashFiles('makefiles/versions.mk', 'go.mod', 'scripts/install_go_tool.sh') }}
      - run: make install
      - run: make check
      - run: make test-race
      - run: make build

  images:
    name: Build and publish application images
    needs: [check]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      manifest: ${{ steps.publish.outputs.manifest }}
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Build images without runtime secrets
        run: make image-check image-build
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the images built above
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: make image-publish
      - name: Save digest manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: image-release
          path: .images/release.json
          include-hidden-files: true
          retention-days: 30

  deploy:
    name: Deploy published digests to VM
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deliver checked SHA and immutable images
        run: make ci-ssh-deploy
        env:
          DEPLOY_SHA: ${{ github.sha }}
          IMAGE_MANIFEST_B64: ${{ needs.images.outputs.manifest }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
